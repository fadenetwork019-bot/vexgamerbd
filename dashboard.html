<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VexGamerBD Admin Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
}

header{
background:#111827;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
color:#00ffae;
font-size:25px;
}

.container{
max-width:1000px;
margin:30px auto;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
margin-bottom:25px;
}

.card h2{
color:#00ffae;
margin-bottom:15px;
}

input,
textarea,
select{

width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#334155;
color:white;

}

textarea{
height:120px;
}

button{

width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:10px;
background:#00ffae;
color:black;
font-weight:bold;
cursor:pointer;

}

.logout{

width:auto;
padding:10px 20px;
background:#ff4444;
color:white;

}


#gamesList{
margin-top:20px;
}


.game-card{

background:#334155;
padding:15px;
border-radius:12px;
margin-top:15px;

}


.game-card img{

width:180px;
border-radius:10px;

}


.edit{

background:#ffc107;

}


.delete{

background:#dc3545;
color:white;

}

</style>

</head>


<body>


<header>

<h1>🎮 VexGamerBD Admin</h1>


<button class="logout" onclick="logout()">
Logout
</button>


</header>



<div class="container">


<div class="card">


<h2>➕ Add New Game</h2>


<input id="name" placeholder="Game Name">


<input id="image" placeholder="Game Image URL">


<input id="version" placeholder="Version">


<input id="android" placeholder="Android Version">


<input id="size" placeholder="Game Size">


<select id="category">

<option>Horror</option>

<option>Action</option>

<option>Adventure</option>

<option>Minecraft</option>

<option>Other</option>

</select>



<input id="code" placeholder="Secret Download Code">


<input id="download" placeholder="Download Link">


<textarea id="description" placeholder="Game Description"></textarea>


<button id="addBtn">
➕ Add Game
</button>


</div>



<div class="card">


<h2>🎮 All Games</h2>


<div id="gamesList">

Loading Games...

</div>


</div>



</div>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
updateDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyB3RgKEoYuaRoySgzM7eCEN9ArFsiSepX0",

authDomain: "infinity-mart-28000.firebaseapp.com",

projectId: "infinity-mart-28000",

storageBucket: "infinity-mart-28000.firebasestorage.app",

messagingSenderId: "64222307926",

appId: "1:64222307926:web:f5c22c05f48fffda24fdf7"

};



const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);



onAuthStateChanged(auth,(user)=>{


if(!user){

location.href="admin-login.html";

}

else{

loadGames();

}


});





window.logout=function(){

signOut(auth).then(()=>{

location.href="admin-login.html";

});

};





let editId = null;



document.getElementById("addBtn").onclick = async function(){


let data={

name:name.value,

image:image.value,

version:version.value,

android:android.value,

size:size.value,

category:category.value,

code:code.value,

download:download.value,

description:description.value,

createdAt:Date.now()

};



if(editId){


await updateDoc(
doc(db,"games",editId),
data
);


alert("Game Updated");


editId=null;


this.innerHTML="➕ Add Game";


}

else{


await addDoc(
collection(db,"games"),
data
);


alert("Game Added");


}



location.reload();



};






async function loadGames(){


let box=document.getElementById("gamesList");


try{


let snap=await getDocs(
collection(db,"games")
);



box.innerHTML="";



if(snap.empty){

box.innerHTML="<h3>No Games Found</h3>";

return;

}



snap.forEach((d)=>{


let g=d.data();



box.innerHTML += `


<div class="game-card">


<img src="${g.image}">


<h3>${g.name}</h3>


<p>Version: ${g.version}</p>


<p>Size: ${g.size}</p>


<p>Category: ${g.category}</p>



<button class="edit"
onclick="editGame('${d.id}')">

✏️ Edit

</button>



<button class="delete"
onclick="deleteGame('${d.id}')">

🗑 Delete

</button>


</div>



`;



});



}

catch(e){


console.log(e);


box.innerHTML="<h3>❌ Failed Loading Games</h3>";


}


}






window.deleteGame=async function(id){


if(confirm("Delete this game?")){


await deleteDoc(
doc(db,"games",id)
);


alert("Deleted");


loadGames();


}


};






window.editGame=async function(id){


let snap=await getDocs(
collection(db,"games")
);



snap.forEach((d)=>{


if(d.id==id){


let g=d.data();



name.value=g.name;

image.value=g.image;

version.value=g.version;

android.value=g.android;

size.value=g.size;

category.value=g.category;

code.value=g.code;

download.value=g.download;

description.value=g.description;



editId=id;



document.getElementById("addBtn").innerHTML="💾 Update Game";



}


});



};



</script>


</body>

</html>
